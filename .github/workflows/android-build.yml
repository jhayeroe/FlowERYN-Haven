name: Build FlowERYN Haven APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android source
        shell: bash
        run: |
          cat source/chunk_* > source.b64
          base64 -d source.b64 > source.tar.gz
          echo "64ca4b623126ddebdce1d9e0d8831f7a2f47e7ab2ee26bb0dbe9b86022f6eba3  source.tar.gz" | sha256sum -c -
          tar -xzf source.tar.gz
          rm -f source.b64 source.tar.gz
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > gradle.properties
          sed -i '/<item name="colorBackground">/d' app/src/main/res/values/themes.xml
          sed -i 's/app:textColor=/android:textColor=/g' app/src/main/res/layout/activity_main.xml app/src/main/res/layout/activity_materials.xml

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        id: gradle_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlowERYN-Haven-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if Gradle build failed
        if: steps.gradle_build.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Prepare APK artifact
        if: steps.gradle_build.outcome == 'success'
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FlowERYN-Haven-v1.0.2.apk
          test -s FlowERYN-Haven-v1.0.2.apk
          sha256sum FlowERYN-Haven-v1.0.2.apk

      - name: Upload APK
        if: steps.gradle_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FlowERYN-Haven-v1.0.2
          path: FlowERYN-Haven-v1.0.2.apk
          if-no-files-found: error
          retention-days: 30
