name: Build FlowERYN Haven APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and patch Android source
        shell: bash
        run: |
          cat source/chunk_* > source.b64
          base64 -d source.b64 > source.tar.gz
          echo "64ca4b623126ddebdce1d9e0d8831f7a2f47e7ab2ee26bb0dbe9b86022f6eba3  source.tar.gz" | sha256sum -c -
          tar -xzf source.tar.gz
          rm -f source.b64 source.tar.gz
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > gradle.properties
          sed -i '/<item name="colorBackground">/d' app/src/main/res/values/themes.xml
          sed -i 's/app:textColor=/android:textColor=/g' app/src/main/res/layout/activity_main.xml app/src/main/res/layout/activity_materials.xml
          sed -i '/scrollingView.setClipToPadding(false);/d' app/src/main/java/com/floweryn/costing/UiHelper.java
          python3 scripts/apply_runtime_hotfix.py

      - name: Validate startup database patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          db = Path('app/src/main/java/com/floweryn/costing/DBHelper.java').read_text(encoding='utf-8')
          seed = json.loads(Path('app/src/main/assets/seed_data.json').read_text(encoding='utf-8'))
          gradle = Path('app/build.gradle').read_text(encoding='utf-8')

          assert 'private static final int DB_VERSION = 2;' in db
          assert 'name TEXT NOT NULL UNIQUE COLLATE NOCASE, effort' not in db
          assert 'name TEXT NOT NULL COLLATE NOCASE, effort' in db
          assert "versionName '1.0.3'" in gradle
          assert 'versionCode 4' in gradle

          gerbera = [p for p in seed['products'] if p['name'].strip().casefold() == 'gerbera']
          assert len(gerbera) == 2, f'Expected two Gerbera products, found {len(gerbera)}'

          material_names = {m['name'].strip().casefold() for m in seed['materials']}
          for product in seed['products']:
              for usage in product['materials']:
                  assert usage['material'].strip().casefold() in material_names, (product['name'], usage['material'])

          print(f"Validated {len(seed['materials'])} materials and {len(seed['products'])} products")
          print('Duplicate Gerbera entries are intentionally supported by DB v2')
          PY

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Verify APK exists
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk FlowERYN-Haven-v1.0.3.apk
          sha256sum FlowERYN-Haven-v1.0.3.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlowERYN-Haven-build-log-v1.0.3
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlowERYN-Haven-v1.0.3
          path: FlowERYN-Haven-v1.0.3.apk
          if-no-files-found: error
          retention-days: 30
